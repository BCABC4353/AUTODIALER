name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_platform: win32
          npm_config_arch: x64
      - name: Build installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            build-output/*.exe
            build-output/latest.yml
            build-output/*.blockmap
          retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: ./artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ./artifacts/*
          generate_release_notes: true
          draft: false
          make_latest: true

  force-policy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Point forceMinVersion at the new release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ver="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const p = "update-policy.json";
            const d = JSON.parse(fs.readFileSync(p, "utf8"));
            d.forceMinVersion = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + "\n");
          ' "$ver"
          git add update-policy.json
          git commit -m "ops: force fleet to v${ver}"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          git push origin HEAD:main
